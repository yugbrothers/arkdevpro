services:
  - type: web
    name: arkdevpro-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        value: libsql://arkdevpro-abhi-ssh.aws-ap-south-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
